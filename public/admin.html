<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>아코르데 · 관리자</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head>
<body><main class="main"><section class="rsvp-card"><p class="section-label">ADMIN</p><h1>관리자 로그인</h1><p class="rsvp-sub">연락처는 관리자 인증 후에만 조회할 수 있습니다.</p>
